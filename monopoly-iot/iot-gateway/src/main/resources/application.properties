server.port=8085
spring.application.name=iot-gateway

# Database Configuration (SQLite Isolated Database)
spring.datasource.url=jdbc:sqlite:../iot.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MQTT Configuration
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=monopoly-iot-backend
mqtt.topic.sensors=monopoly/sensors/#

# Offline Sensor Buffer (Store & Forward)
sensor.buffer.file=../sensor_events_buffer.jsonl
